<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hojjat Fazayeli — Courses &amp; Lecture Archive</title>
<meta name="description" content="Courses, lecture archive and problem-solving sessions">
<meta property="og:title" content="Hojjat Fazayeli — Courses & Lecture Archive">
<meta property="og:description" content="Course materials,lecture recordings and problem-solving sessions for every course I teach.">
<meta property="og:image" content="https://hojjatfazayeli.github.io/courses/professor.jpg">
<meta property="og:url" content="https://<username>.github.io/<repo-name>/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Hojjat Fazayeli — Courses & Lecture Archive">
<meta name="twitter:description" content="Course materials,lecture recordings and problem-solving sessions for every course I teach.">
<meta name="twitter:image" content="https://hojjatfazayeli.github.io/courses/professor.jpg">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg-grid" aria-hidden="true"></div>

<div id="app">

  <!-- ============ HOME VIEW ============ -->
  <section id="homeView" class="view">
    <header class="site-head">
      <div class="wrap site-head__inner">
    <div class="portrait avatar" id="portrait">
      <span class="portrait__fallback" id="portraitFallback"></span>
    </div>
            <div class="site-head__text">
          <p class="site-head__kicker">Courses &amp; Lecture Archive</p>
          <h1 class="site-head__name" id="professorName"></h1>
          <p class="site-head__title" id="professorTitle"></p>
          <p class="site-head__affil" id="affiliation"></p>
          <p class="site-head__note" id="introNote"></p>
          <div class="site-head__links" id="headLinks"></div>
        </div>
      </div>
    </header>

    <main class="wrap courses-section">
      <h2 class="section-heading">Courses</h2>
      <div id="courseGrid" class="course-grid"></div>
    </main>

    <footer class="site-foot">
      <div class="wrap">
        <p>Last updated: <span id="lastUpdated"></span></p>
      </div>
    </footer>
  </section>

  <!-- ============ COURSE VIEW ============ -->
  <section id="courseView" class="view is-hidden">
    <header class="course-head">
      <div class="wrap course-head__inner">
        <button id="backBtn" class="back-btn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
          <span>All courses</span>
        </button>
        <div class="course-head__titles">
          <h1 id="courseTitle"></h1>
          <span id="courseTerm" class="course-head__term"></span>
        </div>
      </div>
    </header>

    <nav class="sub-tabs" aria-label="Course sections">
      <div class="wrap sub-tabs__inner" id="subTabList" role="tablist"></div>
    </nav>

    <main class="wrap" id="subPanelsRoot"></main>
  </section>

</div>

<script src="courses.js"></script>
<script src="app.js"></script>
</body>
</html>
